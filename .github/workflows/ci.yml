name: CI

# Runs on every push and every pull request (any branch).
# Each job maps to one security or quality gate so failures are immediately obvious.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Minimal permissions — read source + write checks
permissions:
  contents: read
  checks: write

# Cancel superseded runs on the same branch/PR to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Secret scan — blocks if hardcoded credentials are found in src/
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run secret scanner
        run: node scripts/check-secrets.mjs

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Type check — TypeScript strict mode, zero tolerance
  # ─────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Lint — ESLint with Next.js ruleset
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Dependency audit — fails on CRITICAL CVEs (mirrors prebuild gate)
  # ─────────────────────────────────────────────────────────────────────────────
  audit:
    name: Audit (Critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit — CRITICAL gate
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Build — verifies the app compiles cleanly with production settings.
  #    Uses build:ci (skips prebuild) because checks already ran above.
  #    Dummy secrets are safe here: they are only used at request-time, not build.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [secret-scan, typecheck, audit]
    env:
      JWT_SECRET: ci-placeholder-not-real-32chars-xxxxxxx
      SESSION_SECRET: ci-placeholder-not-real-32chars-yyyyyyy
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the Next.js build cache between runs on the same branch
      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: npm run build:ci

      # Upload the standalone output as an artifact so it can be deployed
      # from a subsequent release/deploy workflow without rebuilding.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: .next/
          retention-days: 3
          if-no-files-found: error
